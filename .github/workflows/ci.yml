name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '25'
  PYTHON_VERSION: '3.14'

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Python Jobs (run in parallel)
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Check formatting with black
        run: >-
          uv run black --check
          services/ingest/src/
          services/ingest/tests/

      - name: Check import order with isort
        run: >-
          uv run isort --check-only
          services/ingest/src/
          services/ingest/tests/

      - name: Lint with flake8
        run: >-
          uv run flake8
          services/ingest/src/
          services/ingest/tests/

      - name: Lint with pylint
        run: >-
          uv run pylint
          services/ingest/src/
          services/ingest/tests/

      - name: Check docstrings with pydocstyle
        run: >-
          uv run pydocstyle
          services/ingest/src/

  typecheck-python:
    name: Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: >-
          uv run mypy
          services/ingest/src/
          services/ingest/tests/

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Test ingest
        working-directory: services/ingest
        run: uv run python -m pytest tests/ -v -m "not slow"

  # ===========================================================================
  # JS/TS Jobs (run in parallel)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Check formatting
        run: yarn format

  typecheck-js:
    name: Typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript checks
        run: yarn typecheck

  # ===========================================================================
  # Build gate (requires all lint/test jobs to pass)
  # ===========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - typecheck-python
      - test-python
      - lint-js
      - typecheck-js
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all workspaces
        run: yarn build
