name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '25'
  PYTHON_VERSION: '3.14'

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Python Jobs (run in parallel)
  #
  # While `packages/` is empty these jobs install dependencies and no-op the
  # linters. As soon as the first Python package lands, the linters run for
  # real against `packages/`.
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Detect Python sources
        id: pyfiles
        run: |
          if find services adapters -name "*.py" -type f 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Python files under services/ or adapters/ yet -- linters will no-op."
          fi

      - name: Check formatting with black
        if: steps.pyfiles.outputs.present == 'true'
        run: uv run black --check services/ adapters/

      - name: Check import order with isort
        if: steps.pyfiles.outputs.present == 'true'
        run: uv run isort --check-only services/ adapters/

      - name: Lint with flake8
        if: steps.pyfiles.outputs.present == 'true'
        run: uv run flake8 services/ adapters/

      - name: Lint with pylint
        if: steps.pyfiles.outputs.present == 'true'
        run: uv run pylint services/ adapters/

      - name: Check docstrings with pydocstyle
        if: steps.pyfiles.outputs.present == 'true'
        run: uv run pydocstyle services/ adapters/

  typecheck-python:
    name: Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Detect Python sources
        id: pyfiles
        run: |
          if find services adapters -name "*.py" -type f 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mypy
        if: steps.pyfiles.outputs.present == 'true'
        run: uv run mypy services/ adapters/

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Detect tests
        id: pytests
        run: |
          if find services adapters -path "*/tests/*" -name "*.py" -type f 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Python tests under services/ or adapters/ yet -- pytest will no-op."
          fi

      - name: Run pytest
        if: steps.pytests.outputs.present == 'true'
        run: uv run python -m pytest services/ adapters/ -v

  # ===========================================================================
  # JS/TS Jobs (run in parallel)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Check formatting
        run: yarn format

  typecheck-js:
    name: Typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript checks
        run: yarn typecheck

  # ===========================================================================
  # Build gate (requires all lint/typecheck/test jobs to pass)
  # ===========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - typecheck-python
      - test-python
      - lint-js
      - typecheck-js
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all workspaces
        run: yarn build
