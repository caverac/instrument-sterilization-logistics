name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '25'
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Python Jobs (run in parallel)
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Check formatting with black
        run: >-
          uv run black --check
          services/ingest/src/
          services/ingest/tests/
          services/synth-events/src/
          services/synth-events/tests/

      - name: Check import order with isort
        run: >-
          uv run isort --check-only
          services/ingest/src/
          services/ingest/tests/
          services/synth-events/src/
          services/synth-events/tests/

      - name: Lint with flake8
        run: >-
          uv run flake8
          services/ingest/src/
          services/ingest/tests/
          services/synth-events/src/
          services/synth-events/tests/

      # Pylint runs per-package so tests/__init__.py from different
      # packages don't collide on the `tests.conftest` module name.
      - name: Lint with pylint (ingest)
        run: >-
          uv run pylint
          services/ingest/src/
          services/ingest/tests/

      - name: Lint with pylint (synth-events)
        run: >-
          uv run pylint
          services/synth-events/src/
          services/synth-events/tests/

      - name: Check docstrings with pydocstyle
        run: >-
          uv run pydocstyle
          services/ingest/src/
          services/synth-events/src/

  typecheck-python:
    name: Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: >-
          uv run mypy
          services/ingest/src/
          services/ingest/tests/
          services/synth-events/src/
          services/synth-events/tests/

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Test ingest
        working-directory: services/ingest
        run: uv run python -m pytest tests/ -v -m "not slow"

      - name: Test synth-events
        working-directory: services/synth-events
        run: uv run python -m pytest tests/ -v

  # ===========================================================================
  # Integration tests
  #
  # Brings up the same docker-compose.yml stack used in local dev (Redpanda
  # + Schema Registry), waits for the broker to report healthy and the topic
  # init sidecar to finish, then runs the `-m slow` test suite against it.
  # ===========================================================================

  test-integration:
    name: Integration Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Start dev stack
        run: docker compose up -d

      - name: Wait for Redpanda healthy + topic ready
        run: |
          timeout 90 bash -c 'until docker compose ps redpanda --format json | grep -q "\"Health\":\"healthy\""; do sleep 1; done'
          timeout 30 bash -c 'until docker compose logs redpanda-init 2>&1 | grep -q "topic events ready"; do sleep 1; done'

      - name: Run integration tests
        # --no-cov: integration tests are not the coverage source of truth;
        # the unit test job is. The per-package pyproject sets
        # --cov-fail-under=100, which only the unit run satisfies.
        working-directory: services/ingest
        run: uv run python -m pytest tests/ -v -m slow --no-cov

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ===========================================================================
  # JS/TS Jobs (run in parallel)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Check formatting
        run: yarn format

  typecheck-js:
    name: Typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript checks
        run: yarn typecheck

  test-js:
    name: Test (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run JS/TS tests
        run: yarn workspaces foreach -Apt run test

  # ===========================================================================
  # Build gate (requires all lint/test jobs to pass)
  # ===========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - typecheck-python
      - test-python
      - test-integration
      - lint-js
      - typecheck-js
      - test-js
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all workspaces
        run: yarn build
