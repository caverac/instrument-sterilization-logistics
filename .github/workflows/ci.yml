name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '25'
  PYTHON_VERSION: '3.14'

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Python Jobs (run in parallel)
  #
  # The `pydirs` step emits three lists computed from what's on disk:
  #
  #   pkg_dirs   e.g. "services/ingest"        - one entry per package dir;
  #                                              passed to black, isort, flake8,
  #                                              pylint, mypy, and pytest so that
  #                                              each package's own pyproject is
  #                                              the pytest rootdir.
  #   src_dirs   e.g. "services/ingest/src"    - passed to pydocstyle so we
  #                                              don't lint test docstrings.
  #   present    "true" / "false"              - skip downstream steps when
  #                                              no Python sources exist yet.
  # ===========================================================================

  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Detect Python source dirs
        id: pydirs
        run: |
          pkg_dirs=""
          src_dirs=""
          for top in services adapters; do
            [ -d "$top" ] || continue
            for pkg in "$top"/*; do
              [ -d "$pkg" ] || continue
              if find "$pkg" -name "*.py" -type f | grep -q .; then
                pkg_dirs="$pkg_dirs $pkg"
                [ -d "$pkg/src" ] && src_dirs="$src_dirs $pkg/src"
              fi
            done
          done
          pkg_dirs=$(echo "$pkg_dirs" | xargs)
          src_dirs=$(echo "$src_dirs" | xargs)
          if [ -n "$pkg_dirs" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "pkg_dirs=$pkg_dirs" >> "$GITHUB_OUTPUT"
            echo "src_dirs=$src_dirs" >> "$GITHUB_OUTPUT"
            echo "Python packages: $pkg_dirs"
            echo "Python src dirs: $src_dirs"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Python sources yet -- linters will no-op."
          fi

      - name: Check formatting with black
        if: steps.pydirs.outputs.present == 'true'
        run: uv run black --check ${{ steps.pydirs.outputs.pkg_dirs }}

      - name: Check import order with isort
        if: steps.pydirs.outputs.present == 'true'
        run: uv run isort --check-only ${{ steps.pydirs.outputs.pkg_dirs }}

      - name: Lint with flake8
        if: steps.pydirs.outputs.present == 'true'
        run: uv run flake8 ${{ steps.pydirs.outputs.pkg_dirs }}

      - name: Lint with pylint
        if: steps.pydirs.outputs.present == 'true'
        run: uv run pylint ${{ steps.pydirs.outputs.pkg_dirs }}

      - name: Check docstrings with pydocstyle
        if: steps.pydirs.outputs.present == 'true'
        run: uv run pydocstyle ${{ steps.pydirs.outputs.src_dirs }}

  typecheck-python:
    name: Typecheck (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Detect Python source dirs
        id: pydirs
        run: |
          pkg_dirs=""
          for top in services adapters; do
            [ -d "$top" ] || continue
            for pkg in "$top"/*; do
              [ -d "$pkg" ] || continue
              if find "$pkg" -name "*.py" -type f | grep -q .; then
                pkg_dirs="$pkg_dirs $pkg"
              fi
            done
          done
          pkg_dirs=$(echo "$pkg_dirs" | xargs)
          if [ -n "$pkg_dirs" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "pkg_dirs=$pkg_dirs" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mypy
        if: steps.pydirs.outputs.present == 'true'
        run: uv run mypy ${{ steps.pydirs.outputs.pkg_dirs }}

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Detect Python packages with tests
        id: pytests
        run: |
          pkg_dirs=""
          for top in services adapters; do
            [ -d "$top" ] || continue
            for pkg in "$top"/*; do
              if [ -d "$pkg/tests" ] && find "$pkg/tests" -name "*.py" -type f | grep -q .; then
                pkg_dirs="$pkg_dirs $pkg"
              fi
            done
          done
          pkg_dirs=$(echo "$pkg_dirs" | xargs)
          if [ -n "$pkg_dirs" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "pkg_dirs=$pkg_dirs" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Python tests yet -- pytest will no-op."
          fi

      - name: Run pytest
        if: steps.pytests.outputs.present == 'true'
        # Pass the package path as the arg so pytest's rootdir is the package
        # dir, picking up each package's own [tool.pytest.ini_options] config
        # (asyncio_mode, coverage settings, markers).
        run: uv run pytest ${{ steps.pytests.outputs.pkg_dirs }} -v -m "not slow"

  # ===========================================================================
  # JS/TS Jobs (run in parallel)
  # ===========================================================================

  lint-js:
    name: Lint (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Check formatting
        run: yarn format

  typecheck-js:
    name: Typecheck (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run TypeScript checks
        run: yarn typecheck

  # ===========================================================================
  # Build gate (requires all lint/typecheck/test jobs to pass)
  # ===========================================================================

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - typecheck-python
      - test-python
      - lint-js
      - typecheck-js
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build all workspaces
        run: yarn build
