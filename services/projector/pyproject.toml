[project]
name = "projector"
version = "0.0.0"
description = "Kafka consumer that projects events into Postgres `tray` and `journey` tables."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "confluent-kafka[json]>=2.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[project.scripts]
projector = "projector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projector"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=projector --cov-report=term-missing"
markers = [
    "slow: integration tests requiring docker-compose stack (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["projector"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
