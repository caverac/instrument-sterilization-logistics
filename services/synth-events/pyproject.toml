[project]
name = "synth-events"
version = "0.0.0"
description = "Synthetic journey generator for modeling and demo work."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    # numpy 1.26+ accepted -- our APIs don't use numpy 2 features and
    # pinning lower lets us share a venv with services/routing (PyMC
    # 5.19 / pytensor 2.26 doesn't support numpy 2).
    "numpy>=1.26",
    "pyarrow>=18.0",
]

[project.scripts]
synth-events = "synth_events.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth_events"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "pyarrow-stubs>=20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=synth_events --cov-report=term-missing"

[tool.coverage.run]
source = ["synth_events"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
