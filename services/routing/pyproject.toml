[project]
name = "routing"
version = "0.0.0"
description = "Variance-aware routing model: hierarchical Bayesian fit + three policies + backtest."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "numpy>=1.26,<2.0",
    "pyarrow>=18.0",
    # PyMC for the hierarchical Bayesian fit. Pinned to <5.20 to keep
    # pytensor in the 2.x line; pytensor 3.x makes numba a hard dep,
    # and llvmlite has no macOS x86_64 wheels. pymc 5.19.x with
    # pytensor 2.26.x installs binary-only on macOS x86_64 + Py 3.12.
    "pymc>=5.10,<5.20",
]

[project.scripts]
routing = "routing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routing"]

[dependency-groups]
dev = [
    "pyarrow-stubs>=20",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=routing --cov-report=term-missing"

[tool.coverage.run]
source = ["routing"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
