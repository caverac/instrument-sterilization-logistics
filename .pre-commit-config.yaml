repos:
  - repo: local
    hooks:
      # --- Python formatters (auto-fix) ---
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        files: ^(services|adapters)/

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
        files: ^(services|adapters)/

      # --- Python linters ---
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
        files: ^(services|adapters)/

      # Pylint runs per-package so tests/__init__.py from different
      # packages don't collide on the `tests.conftest` module name.
      # Add one hook per Python package as packages are added.
      - id: pylint-ingest
        name: pylint (ingest)
        entry: uv run pylint
        language: system
        types: [python]
        files: ^services/ingest/

      - id: pylint-synth-events
        name: pylint (synth-events)
        entry: uv run pylint
        language: system
        types: [python]
        files: ^services/synth-events/

      - id: pydocstyle
        name: pydocstyle
        entry: uv run pydocstyle
        language: system
        types: [python]
        files: ^(services|adapters)/.*/src/

      # --- Python typecheck (whole-project, not per-file -- mypy doesn't
      # --- compose per-file well in strict mode). Keep this path list in
      # --- sync with the Run mypy step in .github/workflows/ci.yml.
      - id: mypy
        name: mypy
        entry: >-
          uv run mypy
          services/ingest/src/
          services/ingest/tests/
          services/synth-events/src/
          services/synth-events/tests/
        language: system
        types: [python]
        pass_filenames: false
        files: ^(services|adapters)/

      # --- JS/TS formatters (auto-fix) ---
      - id: prettier
        name: prettier
        entry: yarn prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, markdown, yaml, css]

      # --- JS/TS linters (auto-fix where possible) ---
      - id: eslint
        name: eslint
        entry: yarn eslint --max-warnings 0 --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]

      # --- JS/TS typecheck (whole-project) ---
      - id: typecheck-ts
        name: tsc
        entry: yarn typecheck
        language: system
        pass_filenames: false
        types_or: [ts, tsx]

      # --- Strip non-ASCII characters from text sources ---
      - id: strip-non-ascii
        name: strip non-ascii
        entry: uv run python scripts/strip_non_ascii.py
        language: system
        types_or: [python, javascript, jsx, ts, tsx, json, yaml, markdown, toml]
        exclude: |
          (?x)^(
            CHANGELOG\.md|
            .*/CHANGELOG\.md|
            scripts/strip_non_ascii\.py
          )$

  # --- Commit message lint ---
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: yarn commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
