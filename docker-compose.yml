# Local development stack.
#
# Brings up:
#   - Redpanda          (Kafka API + built-in Schema Registry, single binary, no Zookeeper)
#   - Redpanda Console  (web UI for browsing topics, schemas, consumer groups)
#   - redpanda-init     (one-shot sidecar that creates the `events` topic on first boot)
#   - postgres          (projection store for the projector service)
#
# MinIO will be added when the Kafka Connect S3 sink lands.

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --smp
      - '1'
      - --memory
      - 1G
      - --mode
      - dev-container
      - --default-log-level=warn
    ports:
      - '19092:19092' # Kafka API (from host)
      - '18081:18081' # Schema Registry (from host)
      - '9644:9644' # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -E "Healthy:.+true"']
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda-init:
    image: redpandadata/redpanda:v24.3.5
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        rpk -X brokers=redpanda:9092 topic create events \
          --partitions 6 --replicas 1 \
          --topic-config retention.ms=604800000 \
          --topic-config compression.type=snappy \
          || true
        echo 'topic events ready'
        rpk -X brokers=redpanda:9092 topic list

  redpanda-console:
    image: redpandadata/console:v2.8.0
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ['redpanda:9092']
          schemaRegistry:
            enabled: true
            urls: ['http://redpanda:8081']
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml
        /app/console

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: projector
      POSTGRES_PASSWORD: projector
      POSTGRES_DB: projector
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U projector -d projector']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  redpanda-data:
  postgres-data:
